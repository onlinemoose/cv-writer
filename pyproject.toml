[project]
name = "cv-writer"
version = "0.6.0"
description = "Tailor a candidate's CV to a specific job posting."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "import-linter>=2",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The importable package — a consumer does `from cv_writer import run`.
packages = ["cv_writer"]
